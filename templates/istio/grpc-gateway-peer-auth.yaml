# PeerAuthentication for grpc-gateway: PERMISSIVE mode
#
# WHY PERMISSIVE?
# Kong Ingress Controller has limitations with Istio mTLS:
# 1. Kong generates incorrect service hostnames (grpc-gateway.kong.8080.svc instead of .cluster.local)
# 2. Kong falls back to Pod IP when DNS fails, bypassing Istio routing
# 3. Kong and grpc-gateway are in the SAME namespace (kong) - trusted boundary
#
# SECURITY MODEL:
# - Kong → grpc-gateway: Plaintext (same namespace, no network traversal)
# - grpc-gateway → backends: STRICT mTLS (cross-namespace, requires encryption)
# - Backend ↔ Backend: STRICT mTLS (always encrypted)
#
# This is a pragmatic solution that maintains security where it matters most
# (cross-namespace communication) while working around Kong's limitations.
#
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: grpc-gateway
  namespace: kong
spec:
  selector:
    matchLabels:
      app: grpc-gateway
  mtls:
    mode: PERMISSIVE  # Accept both mTLS and plaintext
