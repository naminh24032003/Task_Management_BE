# Development Environment Configuration

# Infrastructure with minimal resources
infrastructure:
  enabled: true
  nginx:
    replicas: 1
  kong:
    replicas: 1
  kafka:
    replicas: 1
  redis:
    replicas: 1
  consul:
    replicas: 1

# Observability - reduced for dev
observability:
  enabled: true
  prometheus:
    retention: 7d
  loki:
    retention: 3d
  jaeger:
    enabled: true
  sentry:
    enabled: false

# Services
services:
  taskService:
    enabled: true
  userService:
    enabled: true
  projectService:
    enabled: false
  notificationService:
    enabled: false
  authService:
    enabled: false
