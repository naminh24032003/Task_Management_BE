# Production Environment Configuration

# Infrastructure with high availability
infrastructure:
  enabled: true
  nginx:
    replicas: 3
  kong:
    replicas: 3
  kafka:
    replicas: 3
  redis:
    replicas: 2
  consul:
    replicas: 5

# Observability - full stack
observability:
  enabled: true
  prometheus:
    retention: 30d
    persistence:
      size: 50Gi
  loki:
    retention: 15d
    persistence:
      size: 30Gi
  jaeger:
    enabled: true
  sentry:
    enabled: true

# Services - all enabled and scaled
services:
  taskService:
    enabled: true
  userService:
    enabled: true
  projectService:
    enabled: true
  notificationService:
    enabled: true
  authService:
    enabled: true
