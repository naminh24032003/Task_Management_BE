{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "observability.fullname" . }}-loki
  labels:
    app: loki
    {{- include "observability.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "observability.fullname" . }}-loki
  replicas: {{ .Values.loki.replicas }}
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
        args:
          - -config.file=/etc/loki/loki.yaml
        ports:
        - name: http
          containerPort: 3100
        resources:
          {{- toYaml .Values.loki.resources | nindent 10 }}
        {{- if .Values.loki.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /loki
        - name: config
          mountPath: /etc/loki
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "observability.fullname" . }}-loki-config
  {{- if .Values.loki.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.loki.persistence.storageClass }}
      storageClassName: {{ .Values.loki.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.loki.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability.fullname" . }}-loki-config
  labels:
    app: loki
    {{- include "observability.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false
    
    server:
      http_listen_port: 3100
    
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
    
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks
    
    limits_config:
      retention_period: {{ .Values.loki.retention }}
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    
    chunk_store_config:
      max_look_back_period: {{ .Values.loki.retention }}
    
    table_manager:
      retention_deletes_enabled: true
      retention_period: {{ .Values.loki.retention }}
{{- end }}
