{{- if .Values.sentry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability.fullname" . }}-sentry
  labels:
    app: sentry
    {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sentry.replicas }}
  selector:
    matchLabels:
      app: sentry
  template:
    metadata:
      labels:
        app: sentry
    spec:
      containers:
      - name: sentry
        image: "{{ .Values.sentry.image.repository }}:{{ .Values.sentry.image.tag }}"
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        resources:
          {{- toYaml .Values.sentry.resources | nindent 10 }}
        env:
        - name: SENTRY_SECRET_KEY
          value: "changeme-secret-key"
        - name: SENTRY_POSTGRES_HOST
          value: "postgres"
        - name: SENTRY_REDIS_HOST
          value: "redis"
{{- end }}
