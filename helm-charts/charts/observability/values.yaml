# Default values for observability chart

# Prometheus for metrics
prometheus:
  enabled: true
  replicas: 1
  image:
    repository: prom/prometheus
    tag: v2.48.0
  retention: 15d
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

# Grafana for dashboards
grafana:
  enabled: true
  replicas: 1
  image:
    repository: grafana/grafana
    tag: 10.2.2
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Loki for log aggregation
loki:
  enabled: true
  replicas: 1
  image:
    repository: grafana/loki
    tag: 2.9.3
  retention: 7d
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

# Promtail for log collection
promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: 2.9.3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Jaeger for distributed tracing
jaeger:
  enabled: true
  replicas: 1
  image:
    repository: jaegertracing/all-in-one
    tag: "1.52"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Sentry for error tracking
sentry:
  enabled: false
  replicas: 1
  image:
    repository: sentry
    tag: "24.0"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
