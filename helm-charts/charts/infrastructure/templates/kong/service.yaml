{{- if .Values.kong.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrastructure.fullname" . }}-kong-proxy
  labels:
    app: kong
    component: proxy
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kong.proxy.type }}
  selector:
    app: kong
  ports:
  - name: proxy
    port: {{ .Values.kong.proxy.http.port }}
    targetPort: 8000
    protocol: TCP
  - name: proxy-ssl
    port: 8443
    targetPort: 8443
    protocol: TCP
  {{- if .Values.kong.proxy.grpc.enabled }}
  - name: grpc
    port: {{ .Values.kong.proxy.grpc.port }}
    targetPort: 9080
    protocol: TCP
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrastructure.fullname" . }}-kong-admin
  labels:
    app: kong
    component: admin
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kong.admin.type }}
  selector:
    app: kong
  ports:
  - name: admin
    port: {{ .Values.kong.admin.port }}
    targetPort: 8001
    protocol: TCP
{{- end }}
