{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "infrastructure.fullname" . }}-kafka
  labels:
    app: kafka
    {{- include "infrastructure.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "infrastructure.fullname" . }}-kafka-headless
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        env:
        - name: KAFKA_BROKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "{{ include "infrastructure.fullname" . }}-zookeeper:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://$(POD_NAME).{{ include "infrastructure.fullname" . }}-kafka-headless:9092"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: {{ .Values.kafka.replicas | quote }}
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: {{ .Values.kafka.replicas | quote }}
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: {{ div .Values.kafka.replicas 2 | add 1 | quote }}
        - name: KAFKA_HEAP_OPTS
          value: {{ .Values.kafka.jvmHeap | quote }}
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: kafka
          containerPort: 9092
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
        {{- if .Values.kafka.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
        {{- end }}
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.kafka.persistence.storageClass }}
      storageClassName: {{ .Values.kafka.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.kafka.persistence.size }}
  {{- end }}
{{- end }}
