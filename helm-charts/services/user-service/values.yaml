# User Service Configuration (gRPC)
microservice:
  service:
    name: user-service
    type: ClusterIP
    port: 50051
    targetPort: 50051
    grpcPort: 50051
  
  image:
    repository: user-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  replicas: 2
  
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75
  
  healthCheck:
    enabled: false  # gRPC health check requires different probe
  
  monitoring:
    enabled: true
    path: /metrics
    port: 9090  # Separate metrics port for gRPC service
  
  env:
    - name: SERVICE_NAME
      value: "user-service"
    - name: GRPC_PORT
      value: "50051"
    - name: LOG_LEVEL
      value: "info"
  
  secrets:
    DB_PASSWORD: "changeme"
    JWT_SECRET: "your-secret-key"
