# Task Service Configuration
microservice:
  service:
    name: task-service
    type: ClusterIP
    port: 8080
    targetPort: 8080
  
  image:
    repository: task-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  
  replicas: 3
  
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  
  healthCheck:
    enabled: true
    liveness:
      path: /api/v1/health
      port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /api/v1/ready
      port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
  
  monitoring:
    enabled: true
    path: /metrics
    port: 8080
  
  env:
    - name: SERVICE_NAME
      value: "task-service"
    - name: LOG_LEVEL
      value: "info"
  
  secrets:
    DB_PASSWORD: "changeme"
    JWT_SECRET: "your-secret-key"
