{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.fullname" . }}-secret
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "microservice.fullname" . }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretManagerSecretName | required "externalSecret.secretManagerSecretName is required when externalSecret.enabled=true" }}
{{- end }}
