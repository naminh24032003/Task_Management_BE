{{- if and .Values.envVarsSecret (not .Values.externalSecret.enabled) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "microservice.fullname" . }}-secret
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.envVarsSecret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}

