# =============================================================================
# DestinationRule - Task Service
# =============================================================================
# Step 5 & 6: Traffic Management with subsets for canary deployment
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ .Values.services.taskService.name }}-destination
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  host: {{ .Values.services.taskService.host }}
  trafficPolicy:
    # Connection Pool Settings
    connectionPool:
      tcp:
        maxConnections: {{ .Values.connectionPool.tcp.maxConnections }}
        connectTimeout: {{ .Values.connectionPool.tcp.connectTimeout }}
      http:
        h2UpgradePolicy: {{ .Values.connectionPool.http.h2UpgradePolicy }}
        http1MaxPendingRequests: {{ .Values.connectionPool.http.http1MaxPendingRequests }}
        http2MaxRequests: {{ .Values.connectionPool.http.http2MaxRequests }}
        maxRequestsPerConnection: {{ .Values.connectionPool.http.maxRequestsPerConnection }}
        maxRetries: {{ .Values.connectionPool.http.maxRetries }}
    # Circuit Breaker (Step 7)
    outlierDetection:
      consecutive5xxErrors: {{ .Values.resilience.circuitBreaker.consecutiveErrors }}
      interval: {{ .Values.resilience.circuitBreaker.interval }}
      baseEjectionTime: {{ .Values.resilience.circuitBreaker.baseEjectionTime }}
      maxEjectionPercent: {{ .Values.resilience.circuitBreaker.maxEjectionPercent }}
      minHealthPercent: {{ .Values.resilience.circuitBreaker.minHealthPercent }}
    {{- if .Values.security.mtls.enabled }}
    tls:
      mode: ISTIO_MUTUAL
    {{- end }}
  # Subsets for versioning (Step 6)
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
