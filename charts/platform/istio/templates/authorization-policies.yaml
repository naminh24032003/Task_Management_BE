{{- if .Values.security.authorization.enabled }}
# =============================================================================
# AuthorizationPolicy - Default Deny All
# =============================================================================
# Step 8: Security - Block non-mesh pod traffic
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  {}  # Empty spec means deny all by default
---
# =============================================================================
# AuthorizationPolicy - Allow traffic within mesh
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-mesh-traffic
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/*"
              - "cluster.local/ns/istio-system/sa/*"
---
# =============================================================================
# AuthorizationPolicy - Allow Kong to access services
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-kong-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Values.kong.namespace }}
---
# =============================================================================
# AuthorizationPolicy - Task Service
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.services.taskService.name }}-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.services.taskService.name }}
  action: ALLOW
  rules:
    # Allow traffic from gRPC Gateway
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/grpc-gateway"
    # Allow traffic from User Service
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/user-service"
    # Allow health checks
    - to:
        - operation:
            paths:
              - "/health"
              - "/healthz"
              - "/ready"
              - "/readyz"
              - "/live"
              - "/livez"
---
# =============================================================================
# AuthorizationPolicy - User Service
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.services.userService.name }}-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.services.userService.name }}
  action: ALLOW
  rules:
    # Allow traffic from gRPC Gateway
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/grpc-gateway"
    # Allow traffic from Task Service
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Values.namespace }}/sa/task-service"
    # Allow health checks
    - to:
        - operation:
            paths:
              - "/health"
              - "/healthz"
              - "/ready"
              - "/readyz"
              - "/live"
              - "/livez"
---
# =============================================================================
# AuthorizationPolicy - gRPC Gateway
# =============================================================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.services.grpcGateway.name }}-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.services.grpcGateway.name }}
  action: ALLOW
  rules:
    # Allow traffic from Kong ingress
    - from:
        - source:
            namespaces:
              - {{ .Values.kong.namespace }}
    # Allow health checks
    - to:
        - operation:
            paths:
              - "/health"
              - "/healthz"
              - "/ready"
              - "/readyz"
              - "/live"
              - "/livez"
{{- end }}
