{{- if .Values.security.mtls.enabled }}
# =============================================================================
# PeerAuthentication - mTLS Policy
# =============================================================================
# Step 8: Enable mTLS STRICT mode for the namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.security.mtls.mode }}
---
# Namespace-wide mTLS policy for istio-system
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: mesh-mtls
  namespace: istio-system
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.security.mtls.mode }}
{{- end }}
