# =============================================================================
# Sidecar - Limit Egress Traffic
# =============================================================================
# ServiceEntry for external services is commented out
# Uncomment and customize if external service access is needed
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: default-sidecar
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
spec:
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
        - "{{ .Values.kong.namespace }}/*"
        - "{{ .Values.monitoring.namespace }}/*"
        - "logging/*"
