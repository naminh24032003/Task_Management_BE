# =============================================================================
# Grafana Datasource - Jaeger for Istio Tracing
# =============================================================================
# Only create if Jaeger datasource doesn't already exist
{{- if .Values.observability.tracing.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-jaeger-datasource
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "istio-config.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  jaeger-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Jaeger
      type: jaeger
      access: proxy
      url: http://tracing.istio-system.svc.cluster.local:80
      version: 1
      editable: false
      isDefault: false
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          tags: ['app', 'namespace', 'pod']
          mappedTags: [{ key: 'service.name', value: 'app' }]
          mapTagNamesEnabled: true
          spanStartTimeShift: '-1h'
          spanEndTimeShift: '1h'
          filterByTraceID: true
          filterBySpanID: false
{{- end }}
