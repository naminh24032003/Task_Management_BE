# Istio Service Mesh Configuration
namespace: dev

# Monitoring integration (with existing kube-prometheus-stack)
monitoring:
  namespace: monitoring
  prometheusRelease: monitoring  # Helm release name của kube-prometheus-stack

# Services configuration
services:
  taskService:
    name: task-service
    host: task-service.dev.svc.cluster.local
    port: 8080
    grpcPort: 9090
    versions:
      - v1
      - v2
  userService:
    name: user-service
    host: user-service.dev.svc.cluster.local
    port: 3000
    grpcPort: 9090
    versions:
      - v1
      - v2
  grpcGateway:
    name: grpc-gateway
    host: grpc-gateway.dev.svc.cluster.local
    port: 8080
    versions:
      - v1

# Traffic Management
trafficManagement:
  enabled: true
  # Canary deployment configuration
  canary:
    enabled: false
    # Weight distribution (must sum to 100)
    v1Weight: 90
    v2Weight: 10

# Resilience configuration
resilience:
  timeout: 10s
  retries:
    attempts: 3
    perTryTimeout: 3s
    retryOn: "gateway-error,connect-failure,refused-stream,unavailable,cancelled,retriable-4xx"
  circuitBreaker:
    consecutiveErrors: 5
    interval: 30s
    baseEjectionTime: 30s
    maxEjectionPercent: 100
    minHealthPercent: 0

# Connection pool settings
connectionPool:
  tcp:
    maxConnections: 100
    connectTimeout: 10s
  http:
    h2UpgradePolicy: UPGRADE
    http1MaxPendingRequests: 100
    http2MaxRequests: 1000
    maxRequestsPerConnection: 10
    maxRetries: 3

# Security configuration
security:
  mtls:
    enabled: true
    mode: STRICT  # STRICT, PERMISSIVE, DISABLE
  authorization:
    enabled: true

# Observability
observability:
  tracing:
    enabled: true
    samplingRate: 100  # percentage
  metrics:
    enabled: true
    scrapeInterval: 15s  # Prometheus scrape interval
  grafanaDashboards:
    enabled: true
  kiali:
    enabled: false

# Kong integration (no sidecar injection)
kong:
  excludeFromMesh: true
  namespace: kong
