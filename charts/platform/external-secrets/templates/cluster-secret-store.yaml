apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    # IRSA role is annotated on the external-secrets ServiceAccount at install time.
    # This store uses the controller's own AWS credentials (pod identity via IRSA).
    "helm.sh/resource-policy": keep
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.aws.region }}
      # auth via IRSA — no static credentials needed
      # The ESO controller pod has the IRSA role annotation on its ServiceAccount
