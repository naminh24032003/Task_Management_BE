kube-prometheus-stack:
  # Prometheus configuration
  prometheus:
    enabled: true
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      # This allows Prometheus to find ServiceMonitors in any namespace
      serviceMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      # Storage configuration
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
      # Resource limits
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
  
  # Grafana configuration
  grafana:
    enabled: true
    adminPassword: prom-operator
    ingress:
      enabled: false
    # Lưu dữ liệu cấu hình/dashboard bền vững
    persistence:
      enabled: true
      size: 10Gi
    # Tự động load dashboard từ các ConfigMap có label 'grafana_dashboard=1'
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
      datasources:
        enabled: true
        label: grafana_datasource
        searchNamespace: ALL
    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Default datasources
    additionalDataSources:
      - name: Prometheus
        type: prometheus
        url: http://{{ .Release.Name }}-kube-prometheus-prometheus:9090
        access: proxy
        isDefault: true
    
  # Alertmanager configuration
  alertmanager:
    enabled: true
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
    
  # Node Exporter
  nodeExporter:
    enabled: true
    
  # Kube State Metrics
  kubeStateMetrics:
    enabled: true
  
  # Prometheus Operator
  prometheusOperator:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
