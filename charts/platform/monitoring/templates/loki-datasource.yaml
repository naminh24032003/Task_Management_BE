apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      url: http://logging-loki.logging.svc.cluster.local:3100
      version: 1
      editable: false
      jsonData:
        maxLines: 1000
