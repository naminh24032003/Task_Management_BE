# =============================================================================
# Loki - EKS Values (Single binary mode, resource-optimized)
# =============================================================================
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 72h
    max_query_length: 721h

deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  tolerations:
    - key: dedicated
      operator: Equal
      value: platform
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - m7i-flex.large
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: true
    size: 10Gi

# Disable unnecessary components for single binary
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false

# Chunk cache
chunksCache:
  enabled: false
resultsCache:
  enabled: false
