# Kong subchart configuration
kong:
  image:
    repository: kong
    tag: "3.6"

  env:
    database: "off"
    log_level: debug
    # Enable pre-function/post-function plugins with custom Lua code
    untrusted_lua: "on"
    # OpenTelemetry configuration
    tracing_instrumentations: all
    tracing_sampling_rate: "1.0"

# Redis password used by the rate-limiting plugin distributed counter
# Override in values-eks.yaml or via --set
kongPlugins:
  rateLimiting:
    redisPassword: "redisPass123"

  # Bật Ingress Controller để dùng Kubernetes Ingress
  ingressController:
    enabled: true
    installCRDs: false

  admin:
    enabled: true
    type: NodePort
    http:
      enabled: true
      servicePort: 8001

  proxy:
    enabled: true
    type: NodePort
    http:
      enabled: true
      nodePort: 30080

  # RBAC - ServiceAccount cho Kong pods
  serviceAccount:
    create: true  # Để Kong chart tạo, nhưng sẽ dùng name custom
    name: "kong-kong"  # ServiceAccount name (Kong chart sẽ dùng tên này)

  deployment:
    kong:
      enabled: true

  # Custom plugins for OpenTelemetry
  plugins:
    configMaps: []

# Custom plugin configuration via KongPlugin CRD
# Apply after installation
customResources:
  opentelemetryPlugin: |
    apiVersion: configuration.konghq.com/v1
    kind: KongClusterPlugin
    metadata:
      name: opentelemetry-tracing
      annotations:
        kubernetes.io/ingress.class: kong
      labels:
        global: "true"
    config:
      endpoint: "http://otel-collector.tracing.svc.cluster.local:4318/v1/traces"
      resource_attributes:
        service.name: kong-gateway
      headers:
        X-Auth-Token: ""
      header_type: "w3c"
      batch_span_count: 200
      batch_flush_delay: 3
    plugin: opentelemetry
