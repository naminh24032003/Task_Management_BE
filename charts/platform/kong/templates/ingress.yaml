apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: kong
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
    konghq.com/protocols: "http,https"
    # Apply JWT authentication plugin
    konghq.com/plugins: jwt-auth
spec:
  ingressClassName: kong
  rules:
  - http:
      paths:
      # ============================================================
      # BFF (GraphQL Gateway) - Primary API endpoint
      # ============================================================
      # GraphQL endpoint - main entry point for frontend apps
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: bff-service
            port:
              number: 4000
      # BFF health check
      - path: /bff/health
        pathType: Exact
        backend:
          service:
            name: bff-service
            port:
              number: 9092
