apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rbac
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - services
      - endpoints
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch

  # Secrets
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # ConfigMaps
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # Events
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch

  # EndpointSlices (required by Kong ingress controller)
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # Ingress resources
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  # Ingress status
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update

  # Kong CRDs - ALL resources
  - apiGroups:
      - configuration.konghq.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch

  # Kong CRDs status
  - apiGroups:
      - configuration.konghq.com
    resources:
      - "*/status"
    verbs:
      - update

  # CRD definitions (required for discovery)
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch

  # Gateway API
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - tcproutes
      - udproutes
      - tlsroutes
      - grpcroutes
      - referencegrants
    verbs:
      - get
      - list
      - watch

  # Gateway status
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways/status
      - httproutes/status
    verbs:
      - update
