apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kong-kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rbac
rules:
  # Core resources - Kong cần đọc để discover backends
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch

  # Secrets - TLS certificates, credentials
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch

  # ConfigMaps - declarative config (nếu dùng)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  # Events - Kong có thể ghi events (optional)
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - create
      - patch

  # Ingress resources - nếu bật Ingress Controller
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - ingressclasses
    verbs:
      - get
      - list
      - watch

  # Ingress status - Kong update trạng thái ingress
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - update

  # Kong CRDs - KongPlugin, KongIngress, KongConsumer, etc.
  - apiGroups:
      - configuration.konghq.com
    resources:
      - kongplugins
      - kongclusterplugins
      - kongconsumers
      - kongcredentials
      - kongingresses
    verbs:
      - get
      - list
      - watch

  # Gateway API (nếu dùng)
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
      - httproutes
      - tcproutes
      - udproutes
      - tlsroutes
      - grpcroutes
    verbs:
      - get
      - list
      - watch

  # Gateway status
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways/status
      - httproutes/status
    verbs:
      - update
