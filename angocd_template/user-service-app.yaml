apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Project to which this application belongs
  project: default

  # Source repository configuration
  source:
    # Git repository URL (replace with your actual repo)
    repoURL: https://github.com/your-org/task-management-be.git
    targetRevision: main
    path: apps/user-service

    # Helm-specific configuration
    helm:
      releaseName: user-service
      valueFiles:
        - values-minikube.yaml

  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  # Sync policy
  syncPolicy:
    # Automated sync configuration
    automated:
      prune: true       # Delete resources that are no longer defined in Git
      selfHeal: true    # Sync when cluster state deviates from Git
      allowEmpty: false # Don't sync if app has no resources

    # Sync options
    syncOptions:
      - CreateNamespace=true  # Create namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true

    # Retry configuration
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore differences in certain fields
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # Ignore replicas if using HPA

  # Revisions history limit
  revisionHistoryLimit: 10
