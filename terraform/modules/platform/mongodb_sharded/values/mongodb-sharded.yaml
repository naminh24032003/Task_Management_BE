# =============================================================================
# MongoDB Sharded Helm Values
# Based on mongo_shard/mongodb-sharded.yaml (Bitnami Chart v9.2.4)
# Optimized for Minikube/Local development
# =============================================================================

## @section Global parameters
global:
  imageRegistry: "${image_registry}"
  imagePullSecrets: []
  defaultStorageClass: "${storage_class}"
  storageClass: "${storage_class}"
  compatibility:
    openshift:
      adaptSecurityContext: auto
  # Allow bitnamilegacy images (required for mongodb-sharded legacy images)
  security:
    allowInsecureImages: true

## @section Common parameters
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
commonLabels: {}
commonAnnotations: {}

## @section MongoDB Sharded parameters
image:
  registry: ${image_registry}
  repository: ${image_repository}
  tag: ${image_tag}
  pullPolicy: ${image_pull_policy}
  pullSecrets: []
  debug: false

## @section Authentication
auth:
  enabled: true
  rootUser: root
  rootPassword: "${root_password}"
  replicaSetKey: "${replica_set_key}"
  existingSecret: ""

## @section Sharding parameters
shards: ${shard_count}

## @section Volume Permissions (Init Container for PV/PVC)
volumePermissions:
  enabled: ${volume_permissions_enabled}
  image:
    registry: ${volume_permissions_image_registry}
    repository: ${volume_permissions_image_repository}
    tag: ${volume_permissions_image_tag}
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

## @section Service parameters
service:
  name: ""
  annotations: {}
  type: ${service_type}
  externalTrafficPolicy: Cluster
  ports:
    mongodb: 27017
  clusterIP: ""
  nodePorts:
    mongodb: ""
    metrics: ""
  externalIPs: []
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  extraPorts: []
  sessionAffinity: None
  sessionAffinityConfig: {}
  headless:
    annotations: {}

## @section Network Policies
networkPolicy:
  enabled: ${network_policy_enabled}
  allowExternal: true
  allowExternalEgress: true
  extraIngress: []
  extraEgress: []
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

## @section Config Server parameters
configsvr:
  replicaCount: ${configsvr_replica_count}
  resourcesPreset: "none"
  resources:
    requests:
      cpu: ${configsvr_request_cpu}
      memory: ${configsvr_request_memory}
    limits:
      cpu: ${configsvr_limit_cpu}
      memory: ${configsvr_limit_memory}
  automountServiceAccountToken: false
  hostAliases: []
  mongodbExtraFlags: []
  topologySpreadConstraints: []
  priorityClassName: ""
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
%{ if use_node_selector ~}
  nodeSelector:
    "doks.digitalocean.com/node-pool": ${node_pool_label}
%{ else ~}
  nodeSelector: {}
%{ endif ~}
  tolerations: []
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  config: ""
  configCM: ""
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  sidecars: []
  initContainers: []
  podAnnotations: {}
  podLabels: {}
  extraVolumes: []
  extraVolumeMounts: []
  schedulerName: ""
  pdb:
    create: false
    minAvailable: 0
    maxUnavailable: 1
  persistence:
    enabled: ${persistence_enabled}
    mountPath: /bitnami/mongodb
    subPath: ""
    storageClass: "${storage_class}"
    accessModes:
      - ReadWriteOnce
    size: ${configsvr_persistence_size}
    annotations: {}
    selector: {}
  persistentVolumeClaimRetentionPolicy:
    enabled: false
    whenScaled: Retain
    whenDeleted: Retain
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  external:
    host: ""
    rootPassword: ""
    replicasetName: ""
    replicasetKey: ""
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  command:
    - /bin/bash
    - /entrypoint/replicaset-entrypoint.sh
  args: []
  terminationGracePeriodSeconds: ""
  lifecycleHooks: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 2
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}

## @section Mongos parameters
mongos:
  replicaCount: ${mongos_replica_count}
  resourcesPreset: "none"
  resources:
    requests:
      cpu: ${mongos_request_cpu}
      memory: ${mongos_request_memory}
    limits:
      cpu: ${mongos_limit_cpu}
      memory: ${mongos_limit_memory}
  automountServiceAccountToken: false
  hostAliases: []
  mongodbExtraFlags: []
  topologySpreadConstraints: []
  priorityClassName: ""
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
%{ if use_node_selector ~}
  nodeSelector:
    "doks.digitalocean.com/node-pool": ${node_pool_label}
%{ else ~}
  nodeSelector: {}
%{ endif ~}
  tolerations: []
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  config: ""
  configCM: ""
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  sidecars: []
  initContainers: []
  podAnnotations: {}
  podLabels: {}
  extraVolumes: []
  extraVolumeMounts: []
  schedulerName: ""
  useStatefulSet: false
  pdb:
    create: false
    minAvailable: 0
    maxUnavailable: 1
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  command: []
  args: []
  terminationGracePeriodSeconds: ""
  lifecycleHooks: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 2
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}

## @section Shard configuration: Data node parameters
shardsvr:
  dataNode:
    replicaCount: ${shardsvr_replica_count}
    resourcesPreset: "none"
    resources:
      requests:
        cpu: ${shardsvr_request_cpu}
        memory: ${shardsvr_request_memory}
      limits:
        cpu: ${shardsvr_limit_cpu}
        memory: ${shardsvr_limit_memory}
    mongodbExtraFlags: []
    topologySpreadConstraints: []
    priorityClassName: ""
    podAffinityPreset: ""
    podAntiAffinityPreset: soft
    nodeAffinityPreset:
      type: ""
      key: ""
      values: []
    affinity: {}
%{ if use_node_selector ~}
    nodeSelector:
      "doks.digitalocean.com/node-pool": ${node_pool_label}
%{ else ~}
    nodeSelector: {}
%{ endif ~}
    tolerations: []
    podManagementPolicy: OrderedReady
    updateStrategy:
      type: RollingUpdate
    automountServiceAccountToken: false
    hostAliases: []
    config: ""
    configCM: ""
    extraEnvVars: []
    extraEnvVarsCM: ""
    extraEnvVarsSecret: ""
    sidecars: []
    initContainers: []
    podAnnotations: {}
    podLabels: {}
    extraVolumes: []
    extraVolumeMounts: []
    schedulerName: ""
    pdb:
      create: false
      minAvailable: 0
      maxUnavailable: 1
    serviceAccount:
      create: true
      name: ""
      annotations: {}
      automountServiceAccountToken: false
    podSecurityContext:
      enabled: true
      fsGroupChangePolicy: Always
      sysctls: []
      supplementalGroups: []
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      seLinuxOptions: {}
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: "RuntimeDefault"
    command:
      - /bin/bash
      - /entrypoint/replicaset-entrypoint.sh
    args: []
    terminationGracePeriodSeconds: ""
    lifecycleHooks: {}
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 20
      failureThreshold: 2
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 20
      failureThreshold: 6
      successThreshold: 1
    startupProbe:
      enabled: false
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
      successThreshold: 1
    customLivenessProbe: {}
    customReadinessProbe: {}
    customStartupProbe: {}

  ## Arbiter (disabled for minikube)
  arbiter:
    replicaCount: 0

  ## Persistence for shard servers
  persistence:
    enabled: ${persistence_enabled}
    mountPath: /bitnami/mongodb
    subPath: ""
    storageClass: "${storage_class}"
    accessModes:
      - ReadWriteOnce
    size: ${shardsvr_persistence_size}
    annotations: {}
    selector: {}
  persistentVolumeClaimRetentionPolicy:
    enabled: false
    whenScaled: Retain
    whenDeleted: Retain

## @section Metrics parameters
metrics:
  enabled: ${metrics_enabled}
  image:
    registry: docker.io
    repository: bitnami/mongodb-exporter
    tag: 0.43.1-debian-12-r6
    pullPolicy: IfNotPresent
    pullSecrets: []
  resourcesPreset: "nano"
  resources: {}
  containerPort: 9216
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9216"
    type: ClusterIP
    ports:
      metrics: 9216
  livenessProbe:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    enabled: false
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    enabled: false
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  prometheusScrapeDisabled: false
  extraFlags: ""
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9216"
  podLabels: {}
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    metricRelabelings: []
    labels: {}
    selector: {}
    honorLabels: false
    jobLabel: ""
  prometheusRule:
    enabled: false
    namespace: ""
    additionalLabels: {}
    rules: []
