# =============================================================================
# Istiod Helm Values Template
# =============================================================================
# This file is rendered by Terraform templatefile() function
# =============================================================================

# -----------------------------------------------------------------------------
# Pilot (Istiod) Configuration
# -----------------------------------------------------------------------------
pilot:
  # Resources
  resources:
    requests:
      cpu: "${istiod_request_cpu}"
      memory: "${istiod_request_memory}"
    limits:
      cpu: "${istiod_limit_cpu}"
      memory: "${istiod_limit_memory}"
  
  # Autoscaling
  autoscaleEnabled: true
  autoscaleMin: 1
  autoscaleMax: 3
  
  # Enable status port for readiness
  replicaCount: 1
  
  # Tracing
  traceSampling: ${tracing_sampling_rate}

# -----------------------------------------------------------------------------
# Global Mesh Configuration
# -----------------------------------------------------------------------------
global:
  # Proxy (Envoy sidecar) defaults
  proxy:
    resources:
      requests:
        cpu: "${proxy_request_cpu}"
        memory: "${proxy_request_memory}"
      limits:
        cpu: "${proxy_limit_cpu}"
        memory: "${proxy_limit_memory}"
    
    # Logging
    logLevel: warning
    componentLogLevel: "misc:error"
    
    # Tracing
    tracer: "zipkin"
  
  # Proxy init container
  proxy_init:
    resources:
      limits:
        cpu: 100m
        memory: 50Mi
      requests:
        cpu: 10m
        memory: 10Mi

# -----------------------------------------------------------------------------
# Mesh Configuration
# -----------------------------------------------------------------------------
meshConfig:
  # Access logging
  accessLogFile: "/dev/stdout"
  accessLogFormat: |
    [%START_TIME%] "%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% "%REQ(X-FORWARDED-FOR)%" "%REQ(USER-AGENT)%" "%REQ(X-REQUEST-ID)%" "%REQ(:AUTHORITY)%" "%UPSTREAM_HOST%"
  
  # Default config for sidecars
  defaultConfig:
    # Tracing
%{ if tracing_enabled ~}
    tracing:
      sampling: ${tracing_sampling_rate}
      zipkin:
        address: zipkin.istio-system:9411
%{ endif ~}
    
    # Hold application start until proxy is ready
    holdApplicationUntilProxyStarts: true
  
  # Enable auto mTLS
  enableAutoMtls: true
  
  # Protocol detection timeout
  protocolDetectionTimeout: 100ms

# -----------------------------------------------------------------------------
# Telemetry Configuration
# -----------------------------------------------------------------------------
telemetry:
  enabled: true
  v2:
    enabled: true
    prometheus:
      enabled: true
