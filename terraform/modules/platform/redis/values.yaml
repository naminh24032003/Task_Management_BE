# =============================================================================
# Redis Cluster Helm Chart Values Template
# =============================================================================
# Bitnami redis-cluster Chart Configuration
# True cluster mode with hash slot sharding
# Optimized for both Minikube and EKS environments
# =============================================================================

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
global:
  redis:
    password: "${password}"
  storageClass: "${storage_class}"

# -----------------------------------------------------------------------------
# Service Name Override
# -----------------------------------------------------------------------------
fullnameOverride: "redis-cluster"

# -----------------------------------------------------------------------------
# Image Configuration
# -----------------------------------------------------------------------------
image:
  registry: docker.io
  repository: bitnami/redis-cluster
  tag: "7.4"
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# Cluster Configuration
# -----------------------------------------------------------------------------
cluster:
  nodes: ${nodes}
  replicas: ${replicas}
  externalAccess:
    enabled: false

# -----------------------------------------------------------------------------
# Redis Authentication
# -----------------------------------------------------------------------------
usePassword: true
password: "${password}"

# -----------------------------------------------------------------------------
# Redis Node Configuration
# -----------------------------------------------------------------------------
redis:
  resources:
    requests:
      cpu: "${request_cpu}"
      memory: "${request_memory}"
    limits:
      cpu: "${limit_cpu}"
      memory: "${limit_memory}"

  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 5
    successThreshold: 1

%{~ if !is_minikube ~}
  nodeSelector:
    node-role: "platform"
%{~ endif ~}

  podAntiAffinity: soft

  configmap: |-
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    slowlog-log-slower-than 10000
    slowlog-max-len 128

# -----------------------------------------------------------------------------
# Persistence Configuration
# -----------------------------------------------------------------------------
persistence:
  enabled: ${persistence_enabled}
  storageClass: "${storage_class}"
  size: "${persistence_size}"
  accessModes:
    - ReadWriteOnce

# -----------------------------------------------------------------------------
# Service Configuration
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  ports:
    redis: 6379

# -----------------------------------------------------------------------------
# Metrics Configuration
# -----------------------------------------------------------------------------
metrics:
  enabled: false
  image:
    registry: docker.io
    repository: bitnami/redis-exporter
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

  serviceMonitor:
    enabled: false
    labels:
      release: monitoring

# -----------------------------------------------------------------------------
# Security Context
# -----------------------------------------------------------------------------
podSecurityContext:
  enabled: true
  fsGroup: 1001

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# -----------------------------------------------------------------------------
# Network Policy
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false

# -----------------------------------------------------------------------------
# Init Containers (Volume Permissions)
# -----------------------------------------------------------------------------
volumePermissions:
  enabled: ${volume_permissions_enabled}
  image:
    registry: docker.io
    repository: bitnami/os-shell
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# -----------------------------------------------------------------------------
# Update Strategy
# -----------------------------------------------------------------------------
updateStrategy:
  type: RollingUpdate
