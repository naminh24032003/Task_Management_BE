# =============================================================================
# Release Pipeline - Tag-based Versioned Release
# =============================================================================
# Trigger: push a semantic version tag  →  git tag v1.2.3 && git push origin v1.2.3
#
# What it does:
#   1. Build & push Docker images tagged with the version (v1.2.3, 1.2, 1, latest)
#   2. Deploy all services to EKS using the versioned image tags
#   3. Create a GitHub Release with auto-generated changelog
#
# Version tag examples:
#   v1.0.0  →  initial stable release
#   v1.1.0  →  new features, backward compatible
#   v1.1.1  →  hotfix / patch
#   v2.0.0  →  breaking changes
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"       # v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"     # v1.0.0-rc.1, v1.0.0-hotfix

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  DEPLOY_NAMESPACE: dev

jobs:
  # ---------------------------------------------------------------------------
  # Extract version info from the tag
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      version_short: ${{ steps.tag.outputs.version_short }}
      is_prerelease: ${{ steps.tag.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          echo "version_short=${TAG#v}" >> $GITHUB_OUTPUT
          # Mark as pre-release if tag contains - (e.g. v1.0.0-rc.1)
          if [[ "${TAG}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Building release: ${TAG}"

  # ---------------------------------------------------------------------------
  # Build & Push versioned Docker images to ECR
  # ---------------------------------------------------------------------------
  build-push:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [version]
    strategy:
      matrix:
        include:
          - service: user-service
            dockerfile: service/user-service/Dockerfile
            context: .
          - service: task-service
            dockerfile: service/task-service/Dockerfile
            context: .
          - service: notification-service
            dockerfile: service/notification-service/Dockerfile
            context: .
          - service: bff-service
            dockerfile: service/bff-service/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (versioned tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}
          tags: |
            # Full semver:  v1.2.3  → image:1.2.3
            type=semver,pattern={{version}}
            # Minor alias:  v1.2.3  → image:1.2
            type=semver,pattern={{major}}.{{minor}}
            # Major alias:  v1.2.3  → image:1
            type=semver,pattern={{major}}
            # SHA for traceability
            type=sha,prefix=
            # latest only on stable (non-prerelease)
            type=raw,value=latest,enable=${{ needs.version.outputs.is_prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Deploy versioned images to EKS
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [version, build-push]
    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: user-service
            namespace: dev
            chart: apps/user-service
            values: apps/user-service/values-eks.yaml
          - service: task-service
            namespace: dev
            chart: apps/task-service
            values: apps/task-service/values-eks.yaml
          - service: notification-service
            namespace: dev
            chart: apps/notification-service
            values: apps/notification-service/values-eks.yaml
          - service: bff-service
            namespace: dev
            chart: apps/bff-service
            values: apps/bff-service/values-eks.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Build Helm dependencies
        run: helm dependency build ${{ matrix.chart }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ matrix.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ${{ matrix.service }} @ ${{ needs.version.outputs.version }}
        run: |
          # Use semver tag (e.g. 1.2.3) as the image tag for this release
          IMAGE_TAG="${{ needs.version.outputs.version_short }}"
          echo "Deploying ${{ matrix.service }} with version tag: ${IMAGE_TAG}"

          MONGODB_URI="mongodb://appuser:${{ secrets.MONGODB_APP_PASSWORD }}@mongodb.dev.svc.cluster.local:27017/${{ matrix.service }}?authSource=${{ matrix.service }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"

          HELM_ARGS=""
          HELM_ARGS="${HELM_ARGS} --set microservice.image.repository=${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}"
          HELM_ARGS="${HELM_ARGS} --set microservice.image.tag=${IMAGE_TAG}"
          HELM_ARGS="${HELM_ARGS} --set microservice.replicaCount=1"
          HELM_ARGS="${HELM_ARGS} --set microservice.autoscaling.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.podDisruptionBudget.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.metrics.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.topologySpreadConstraints=null"

          case "${{ matrix.service }}" in
            user-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.JWT_SECRET=${{ secrets.JWT_SECRET }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder-google-client-id}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder-google-client-secret}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_PASSWORD="
              ;;
            task-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_SASL_PASSWORD="
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.mongodbUri=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.mongodbDatabase=task-service"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.redisAddr=redis-cluster.redis.svc.cluster.local:6379"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.redisPassword=${{ secrets.REDIS_PASSWORD }}"
              ;;
            notification-service)
              MONGODB_URI="mongodb://appuser:${{ secrets.MONGODB_APP_PASSWORD }}@mongodb.dev.svc.cluster.local:27017/notification_db?authSource=notification_db"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_SASL_PASSWORD="
              ;;
            bff-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.JWT_SECRET=${{ secrets.JWT_SECRET }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              ;;
          esac

          # Retry helm upgrade up to 3 times to handle API server rate limiting
          deploy_helm() {
            helm upgrade --install ${{ matrix.service }} ./${{ matrix.chart }} \
              --namespace ${{ matrix.namespace }} \
              --values ${{ matrix.values }} \
              ${HELM_ARGS} \
              --timeout 10m \
              --atomic \
              --cleanup-on-fail \
              --wait
          }

          for attempt in 1 2 3; do
            echo "=== Helm deploy attempt ${attempt}/3 ==="
            if deploy_helm; then
              echo "Deploy succeeded on attempt ${attempt}"
              break
            else
              if [ ${attempt} -eq 3 ]; then
                echo "All 3 attempts failed"
                exit 1
              fi
              echo "Attempt ${attempt} failed. Waiting 30s before retry..."
              sleep 30
            fi
          done

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ matrix.service }} \
            --namespace ${{ matrix.namespace }} \
            --timeout=300s

          echo "--- Pods running version ${{ needs.version.outputs.version }} ---"
          kubectl get pods -n ${{ matrix.namespace }} -l app.kubernetes.io/name=${{ matrix.service }} \
            -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image,READY:.status.containerStatuses[0].ready'

  # ---------------------------------------------------------------------------
  # Create GitHub Release with changelog
  # ---------------------------------------------------------------------------
  github-release:
    runs-on: ubuntu-latest
    needs: [version, deploy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for changelog

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          
          # Find previous tag to scope the changelog
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sed -n '2p')
          
          if [ -z "${PREV_TAG}" ]; then
            echo "First release — showing all commits"
            LOG=$(git log --oneline --no-merges --pretty="- %s (%h)" | head -50)
          else
            echo "Changes since ${PREV_TAG}"
            LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty="- %s (%h)")
          fi
          
          # Write changelog to file to handle multiline
          cat > /tmp/changelog.md << EOF
          ## What's Changed in ${VERSION}
          
          ${LOG}
          
          ### Docker Images
          
          | Service | Image Tag |
          |---------|-----------|
          | user-service | \`${{ env.ECR_REGISTRY }}/task-management/user-service:${{ needs.version.outputs.version_short }}\` |
          | task-service | \`${{ env.ECR_REGISTRY }}/task-management/task-service:${{ needs.version.outputs.version_short }}\` |
          | notification-service | \`${{ env.ECR_REGISTRY }}/task-management/notification-service:${{ needs.version.outputs.version_short }}\` |
          | bff-service | \`${{ env.ECR_REGISTRY }}/task-management/bff-service:${{ needs.version.outputs.version_short }}\` |
          EOF
          
          echo "Changelog generated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "Release ${{ needs.version.outputs.version }}"
          body_path: /tmp/changelog.md
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.is_prerelease == 'false' }}
          generate_release_notes: true
