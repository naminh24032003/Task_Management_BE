name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Infrastructure
        working-directory: terraform/environments/staging
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply tfplan
          
          echo "EKS_CLUSTER=$(terraform output -raw eks_cluster_name)" >> $GITHUB_ENV

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace ${{ env.ENVIRONMENT }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Helm Charts
        run: |
          # Infrastructure
          helm upgrade --install infrastructure ./helm-charts/charts/infrastructure \
            -f ./helm-charts/charts/infrastructure/values/values-staging.yaml \
            -n ${{ env.ENVIRONMENT }} \
            --wait \
            --timeout 10m

          # Observability
          helm upgrade --install observability ./helm-charts/charts/observability \
            -n ${{ env.ENVIRONMENT }} \
            --wait \
            --timeout 10m

          # Task Service
          helm upgrade --install task-service ./helm-charts/services/task-service \
            -f ./helm-charts/services/task-service/values/values-staging.yaml \
            -n ${{ env.ENVIRONMENT }} \
            --wait

          # User Service
          helm upgrade --install user-service ./helm-charts/services/user-service \
            -f ./helm-charts/services/user-service/values/values-staging.yaml \
            -n ${{ env.ENVIRONMENT }} \
            --wait

      - name: Verify Deployment
        run: |
          kubectl get pods -n ${{ env.ENVIRONMENT }}
          kubectl get svc -n ${{ env.ENVIRONMENT }}

      - name: Run Smoke Tests
        run: |
          # Wait for services to be ready
          kubectl wait --for=condition=ready pod -l app=task-service -n ${{ env.ENVIRONMENT }} --timeout=300s
          
          # Test health endpoints
          TASK_SERVICE_POD=$(kubectl get pod -l app=task-service -n ${{ env.ENVIRONMENT }} -o jsonpath='{.items[0].metadata.name}')
          kubectl exec $TASK_SERVICE_POD -n ${{ env.ENVIRONMENT }} -- curl -f http://localhost:8080/api/v1/health || exit 1
          
          echo "✓ Smoke tests passed"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Staging deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
