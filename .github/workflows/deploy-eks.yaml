# =============================================================================
# Deploy to EKS
# =============================================================================
# Trigger: push to main branch, or manual dispatch
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID        - IAM user access key
#   AWS_SECRET_ACCESS_KEY    - IAM user secret key
#   AWS_REGION               - e.g. ap-southeast-1
#   EKS_CLUSTER_NAME         - e.g. task-management-dev
#   ECR_REGISTRY             - e.g. 458108203578.dkr.ecr.ap-southeast-1.amazonaws.com
#
# Required GitHub Secrets for App Config:
#   MONGODB_ROOT_PASSWORD    - MongoDB root password
#   MONGODB_APP_PASSWORD     - MongoDB app user password
#   REDIS_PASSWORD           - Redis cluster password
#   JWT_SECRET               - JWT signing secret
#   GOOGLE_CLIENT_ID         - Google OAuth client ID
#   GOOGLE_CLIENT_SECRET     - Google OAuth client secret
#   SMTP_HOST                - SMTP server host
#   SMTP_USERNAME            - SMTP username
#   SMTP_PASSWORD            - SMTP password
# =============================================================================
name: Deploy to EKS

on:
  push:
    branches: [main]
    # Only run when actual service code changes — skip docs/chart-only pushes
    paths:
      - "service/**"
      - "packages/**"
      - "apps/**"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all, user-service, task-service, notification-service, bff-service)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - user-service
          - task-service
          - notification-service
          - bff-service
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  DEPLOY_NAMESPACE: dev

jobs:
  # ---------------------------------------------------------------------------
  # Detect which services changed / should deploy
  # Works for BOTH push events and manual workflow_dispatch.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.resolve.outputs.user-service }}
      task-service: ${{ steps.resolve.outputs.task-service }}
      notification-service: ${{ steps.resolve.outputs.notification-service }}
      bff-service: ${{ steps.resolve.outputs.bff-service }}
    steps:
      - uses: actions/checkout@v4

      # For push events: detect which service folders actually changed
      - name: Detect changed paths (push only)
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            user-service:
              - 'service/user-service/**'
            task-service:
              - 'service/task-service/**'
              - 'packages/**'
            notification-service:
              - 'service/notification-service/**'
              - 'packages/**'
            bff-service:
              - 'service/bff-service/**'
              - 'packages/**'

      # Resolve final per-service deploy flags for both trigger types
      - name: Resolve deploy targets
        id: resolve
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.service }}"
            echo "Manual dispatch — service input: ${INPUT}"
            for svc in user-service task-service notification-service bff-service; do
              if [ "$INPUT" == "all" ] || [ "$INPUT" == "$svc" ]; then
                echo "${svc}=true" >> $GITHUB_OUTPUT
                echo "  DEPLOY: ${svc}"
              else
                echo "${svc}=false" >> $GITHUB_OUTPUT
                echo "  skip:   ${svc}"
              fi
            done
          else
            echo "Push event — forwarding paths-filter results"
            echo "user-service=${{ steps.paths.outputs.user-service }}" >> $GITHUB_OUTPUT
            echo "task-service=${{ steps.paths.outputs.task-service }}" >> $GITHUB_OUTPUT
            echo "notification-service=${{ steps.paths.outputs.notification-service }}" >> $GITHUB_OUTPUT
            echo "bff-service=${{ steps.paths.outputs.bff-service }}" >> $GITHUB_OUTPUT
            echo "  user-service:        ${{ steps.paths.outputs.user-service }}"
            echo "  task-service:        ${{ steps.paths.outputs.task-service }}"
            echo "  notification-service: ${{ steps.paths.outputs.notification-service }}"
            echo "  bff-service:         ${{ steps.paths.outputs.bff-service }}"
          fi

  # ---------------------------------------------------------------------------
  # Build & Push Docker Images to ECR
  # Only builds services whose code actually changed.
  # ---------------------------------------------------------------------------
  build-push:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            dockerfile: service/user-service/Dockerfile
            context: .
            changed: ${{ needs.changes.outputs.user-service }}
          - service: task-service
            dockerfile: service/task-service/Dockerfile
            context: .
            changed: ${{ needs.changes.outputs.task-service }}
          - service: notification-service
            dockerfile: service/notification-service/Dockerfile
            context: .
            changed: ${{ needs.changes.outputs.notification-service }}
          - service: bff-service
            dockerfile: service/bff-service/Dockerfile
            context: .
            changed: ${{ needs.changes.outputs.bff-service }}
    steps:
      - name: Skip unchanged service
        if: matrix.changed != 'true'
        run: echo "⏭ ${{ matrix.service }} — no changes, skipping build"

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Configure AWS credentials
        if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: matrix.changed == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        if: matrix.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: matrix.changed == 'true'
        run: |
          echo "### ✅ Built ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy to EKS via Helm
  # Only deploys services that were actually built (changed).
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [changes, build-push]
    if: needs.build-push.result != 'failure'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - service: user-service
            namespace: dev
            chart: apps/user-service
            values: apps/user-service/values-eks.yaml
            changed: ${{ needs.changes.outputs.user-service }}
          - service: task-service
            namespace: dev
            chart: apps/task-service
            values: apps/task-service/values-eks.yaml
            changed: ${{ needs.changes.outputs.task-service }}
          - service: notification-service
            namespace: dev
            chart: apps/notification-service
            values: apps/notification-service/values-eks.yaml
            changed: ${{ needs.changes.outputs.notification-service }}
          - service: bff-service
            namespace: dev
            chart: apps/bff-service
            values: apps/bff-service/values-eks.yaml
            changed: ${{ needs.changes.outputs.bff-service }}
    steps:
      - name: Skip unchanged service
        if: matrix.changed != 'true'
        run: echo "⏭ ${{ matrix.service }} — no changes, skipping deploy"

      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: Configure AWS credentials
        if: matrix.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        if: matrix.changed == 'true'
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        if: matrix.changed == 'true'
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Build Helm dependencies
        if: matrix.changed == 'true'
        run: helm dependency build ${{ matrix.chart }}

      - name: Create namespace if not exists
        if: matrix.changed == 'true'
        run: |
          kubectl create namespace ${{ matrix.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ${{ matrix.service }}
        if: matrix.changed == 'true'
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Deploying ${{ matrix.service }} with image tag: ${IMAGE_TAG}"
          
          # Base helm args (common to all services)
          # Secrets are managed by External Secrets Operator (ESO) pulling from
          # AWS Secrets Manager (KMS-encrypted). No plaintext secrets in CI args.
          HELM_ARGS=""
          HELM_ARGS="${HELM_ARGS} --set microservice.image.repository=${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}"
          HELM_ARGS="${HELM_ARGS} --set microservice.image.tag=${IMAGE_TAG}"
          # Keep 1 replica in dev to conserve cluster capacity.
          # HPA will auto-scale if CPU > threshold (metrics-server required).
          HELM_ARGS="${HELM_ARGS} --set microservice.replicaCount=1"
          HELM_ARGS="${HELM_ARGS} --set microservice.metrics.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.topologySpreadConstraints=null"

          # task-service: appConfig for Kratos config file template
          # Non-secret values only — MONGODB_URI and REDIS_PASSWORD come from ESO
          if [ "${{ matrix.service }}" = "task-service" ]; then
            HELM_ARGS="${HELM_ARGS} --set-string appConfig.mongodbDatabase=task-service"
            HELM_ARGS="${HELM_ARGS} --set-string appConfig.redisAddr=redis-cluster.redis.svc.cluster.local:6379"
          fi
          
          # Retry helm upgrade up to 3 times to handle API server rate limiting
          deploy_helm() {
            helm upgrade --install ${{ matrix.service }} ./${{ matrix.chart }} \
              --namespace ${{ matrix.namespace }} \
              --values ${{ matrix.values }} \
              ${HELM_ARGS} \
              --timeout 10m \
              --atomic \
              --cleanup-on-fail \
              --wait
          }
          
          for attempt in 1 2 3; do
            echo "=== Helm deploy attempt ${attempt}/3 ==="
            if deploy_helm; then
              echo "Deploy succeeded on attempt ${attempt}"
              break
            else
              if [ ${attempt} -eq 3 ]; then
                echo "All 3 attempts failed"
                exit 1
              fi
              echo "Attempt ${attempt} failed (rate limiter / timeout). Waiting 30s before retry..."
              sleep 30
            fi
          done

      - name: Verify deployment
        if: matrix.changed == 'true'
        run: |
          kubectl rollout status deployment/${{ matrix.service }} \
            --namespace ${{ matrix.namespace }} \
            --timeout=300s

          echo "--- Pod Status ---"
          kubectl get pods -n ${{ matrix.namespace }} -l app.kubernetes.io/name=${{ matrix.service }} \
            -o custom-columns='NAME:.metadata.name,STATUS:.status.phase,READY:.status.containerStatuses[0].ready,IMAGE:.spec.containers[0].image'

          echo "### ✅ Deployed ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image tag:** \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ matrix.namespace }}\`" >> $GITHUB_STEP_SUMMARY
