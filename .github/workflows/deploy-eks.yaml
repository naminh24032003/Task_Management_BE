# =============================================================================
# Deploy to EKS
# =============================================================================
# Trigger: push to main branch, or manual dispatch
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID        - IAM user access key
#   AWS_SECRET_ACCESS_KEY    - IAM user secret key
#   AWS_REGION               - e.g. ap-southeast-1
#   EKS_CLUSTER_NAME         - e.g. task-management-dev
#   ECR_REGISTRY             - e.g. 458108203578.dkr.ecr.ap-southeast-1.amazonaws.com
#
# Required GitHub Secrets for App Config:
#   MONGODB_ROOT_PASSWORD    - MongoDB root password
#   MONGODB_APP_PASSWORD     - MongoDB app user password
#   REDIS_PASSWORD           - Redis cluster password
#   JWT_SECRET               - JWT signing secret
#   GOOGLE_CLIENT_ID         - Google OAuth client ID
#   GOOGLE_CLIENT_SECRET     - Google OAuth client secret
#   SMTP_HOST                - SMTP server host
#   SMTP_USERNAME            - SMTP username
#   SMTP_PASSWORD            - SMTP password
# =============================================================================
name: Deploy to EKS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all, user-service, task-service, notification-service, bff-service)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - user-service
          - task-service
          - notification-service
          - bff-service
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  DEPLOY_NAMESPACE: dev

jobs:
  # ---------------------------------------------------------------------------
  # Detect changes (for push trigger)
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.changes.outputs.user-service }}
      task-service: ${{ steps.changes.outputs.task-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
      bff-service: ${{ steps.changes.outputs.bff-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            user-service:
              - 'service/user-service/**'
            task-service:
              - 'service/task-service/**'
              - 'shared/**'
            notification-service:
              - 'service/notification-service/**'
              - 'shared/**'
            bff-service:
              - 'service/bff-service/**'

  # ---------------------------------------------------------------------------
  # Build & Push Docker Images to ECR
  # ---------------------------------------------------------------------------
  build-push:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [changes]
    if: always()
    strategy:
      matrix:
        include:
          - service: user-service
            dockerfile: service/user-service/Dockerfile
            context: .
          - service: task-service
            dockerfile: service/task-service/Dockerfile
            context: .
          - service: notification-service
            dockerfile: service/notification-service/Dockerfile
            context: .
          - service: bff-service
            dockerfile: service/bff-service/Dockerfile
            context: .
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check if should build
        id: should-build
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.service }}" == "all" ] || [ "${{ github.event.inputs.service }}" == "${{ matrix.service }}" ]; then
              echo "build=true" >> $GITHUB_OUTPUT
            else
              echo "build=false" >> $GITHUB_OUTPUT
            fi
          else
            # Always build all services to ensure SHA tag exists
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.should-build.outputs.build == 'true'

      - name: Configure AWS credentials
        if: steps.should-build.outputs.build == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.should-build.outputs.build == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        if: steps.should-build.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to EKS via Helm
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    environment: prod_env
    needs: [build-push]
    if: always() && needs.build-push.result != 'failure'
    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: user-service
            namespace: dev
            chart: apps/user-service
            values: apps/user-service/values-eks.yaml
          - service: task-service
            namespace: dev
            chart: apps/task-service
            values: apps/task-service/values-eks.yaml
          - service: notification-service
            namespace: dev
            chart: apps/notification-service
            values: apps/notification-service/values-eks.yaml
          - service: bff-service
            namespace: dev
            chart: apps/bff-service
            values: apps/bff-service/values-eks.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Check if should deploy
        id: should-deploy
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.service }}" == "all" ] || [ "${{ github.event.inputs.service }}" == "${{ matrix.service }}" ]; then
              echo "deploy=true" >> $GITHUB_OUTPUT
            else
              echo "deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install Helm
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: azure/setup-helm@v3
        with:
          version: "3.14.0"

      - name: Build Helm dependencies
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          helm dependency build ${{ matrix.chart }}

      - name: Create namespace if not exists
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          kubectl create namespace ${{ matrix.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ${{ matrix.service }}
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "Deploying ${{ matrix.service }} with image tag: ${IMAGE_TAG}"
          
          MONGODB_URI="mongodb://appuser:${{ secrets.MONGODB_APP_PASSWORD }}@mongodb.dev.svc.cluster.local:27017/${{ matrix.service }}?authSource=${{ matrix.service }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          
          # Base helm args (common to all services)
          HELM_ARGS=""
          HELM_ARGS="${HELM_ARGS} --set microservice.image.repository=${{ env.ECR_REGISTRY }}/task-management/${{ matrix.service }}"
          HELM_ARGS="${HELM_ARGS} --set microservice.image.tag=${IMAGE_TAG}"
          HELM_ARGS="${HELM_ARGS} --set microservice.replicaCount=1"
          HELM_ARGS="${HELM_ARGS} --set microservice.autoscaling.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.podDisruptionBudget.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.metrics.enabled=false"
          HELM_ARGS="${HELM_ARGS} --set microservice.topologySpreadConstraints=null"
          
          # Per-service secrets via envVarsSecret (creates {name}-secret)
          case "${{ matrix.service }}" in
            user-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.JWT_SECRET=${{ secrets.JWT_SECRET }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder-google-client-id}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-placeholder-google-client-secret}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_PASSWORD="
              ;;
            task-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_SASL_PASSWORD="
              # appConfig for Kratos config file template
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.mongodbUri=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.mongodbDatabase=task-service"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.redisAddr=redis-cluster.redis.svc.cluster.local:6379"
              HELM_ARGS="${HELM_ARGS} --set-string appConfig.redisPassword=${{ secrets.REDIS_PASSWORD }}"
              ;;
            notification-service)
              MONGODB_URI="mongodb://appuser:${{ secrets.MONGODB_APP_PASSWORD }}@mongodb.dev.svc.cluster.local:27017/notification_db?authSource=notification_db"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.MONGODB_URI=${MONGODB_URI}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.KAFKA_SASL_PASSWORD="
              ;;
            bff-service)
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.JWT_SECRET=${{ secrets.JWT_SECRET }}"
              HELM_ARGS="${HELM_ARGS} --set-string microservice.envVarsSecret.REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}"
              ;;
          esac
          
          helm upgrade --install ${{ matrix.service }} ./${{ matrix.chart }} \
            --namespace ${{ matrix.namespace }} \
            --values ${{ matrix.values }} \
            ${HELM_ARGS} \
            --timeout 8m \
            --wait

      - name: Verify deployment
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          kubectl rollout status deployment/${{ matrix.service }} \
            --namespace ${{ matrix.namespace }} \
            --timeout=300s
          
          echo "--- Pod Status ---"
          kubectl get pods -n ${{ matrix.namespace }} -l app.kubernetes.io/name=${{ matrix.service }}
          
          echo "--- Recent Events ---"
          kubectl get events -n ${{ matrix.namespace }} --sort-by='.lastTimestamp' | tail -5
