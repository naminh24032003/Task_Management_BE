image:
  registry: docker.io
  repository: bitnamilegacy/mongodb-sharded
  tag: 8.0.12-debian-12-r0
  debug: true

auth:
  enabled: true
  rootUser: root
  rootPassword: password123

shards: 1

configsvr:
  replicaCount: 1

shardsvr:
  dataNode:
    replicaCount: 1

mongos:
  replicaCount: 1

persistence:
  enabled: true
  size: 8Gi

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
