# =============================================================================
# Notification Service - EKS Environment Values
# =============================================================================
microservice:
  # External Secrets — syncs KMS-encrypted secret from AWS Secrets Manager
  externalSecret:
    enabled: true
    clusterSecretStoreName: aws-secrets-manager
    secretManagerSecretName: task-management/dev/notification-service
    refreshInterval: "1h"

  nameOverride: notification-service
  replicaCount: 2

  # =========================================================
  # CONTAINER IMAGE (ECR)
  # =========================================================
  image:
    repository: "${ECR_REGISTRY}/task-management/notification-service"
    tag: "${IMAGE_TAG}"
    pullPolicy: Always

  # Override CMD to load EKS config
  args:
    - "-conf"
    - "./configs/config-eks.yaml"

  # =========================================================
  # ENVIRONMENT VARIABLES (ConfigMap)
  # =========================================================
  envVarsCM:
    GO_ENV: production
    # MongoDB
    MONGODB_DATABASE: "notification_db"
    # Redis
    REDIS_HOST: "redis-cluster.redis.svc.cluster.local"
    REDIS_PORT: "6379"
    # OpenTelemetry
    OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.tracing.svc.cluster.local:4317"
    OTEL_SERVICE_NAME: "notification-service"
    # Kafka
    KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
    KAFKA_CONSUMER_TOPIC: "task.events"
    KAFKA_PRODUCER_TOPIC: "notification.events.v1"
    KAFKA_CONSUMER_GROUP: "notification-service"
    KAFKA_SASL_ENABLED: "true"
    KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"
    KAFKA_SASL_USERNAME: "kafka-user"
    KAFKA_WORKER_POOL_SIZE: "10"
    KAFKA_BUFFER_SIZE: "200"
    # User Service
    USER_SERVICE_ADDR: "user-service.dev.svc.cluster.local:50051"
    # Logging
    LOG_LEVEL: "info"
    LOG_FORMAT: "json"

  # =========================================================
  # SENSITIVE ENVIRONMENT VARIABLES (Secrets)
  # =========================================================
  envVarsSecret:
    MONGODB_URI: "PLACEHOLDER"
    REDIS_PASSWORD: "PLACEHOLDER"
    KAFKA_SASL_PASSWORD: ""

  # =========================================================
  # CONTAINER PORTS
  # =========================================================
  containerPorts:
    http-metrics:
      port: 9093

  # =========================================================
  # SERVICE CONFIGURATION
  # =========================================================
  service:
    type: ClusterIP
    ports:
      http-metrics:
        port: 9093
        targetPort: http-metrics

  # =========================================================
  # RESOURCE REQUESTS & LIMITS
  # =========================================================
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # =========================================================
  # HEALTH PROBES (TCP - notification-service has no HTTP health endpoint)
  # =========================================================
  livenessProbe:
    httpGet: null
    tcpSocket:
      port: http-metrics
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet: null
    tcpSocket:
      port: http-metrics
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # =========================================================
  # AUTOSCALING (HPA)
  # =========================================================
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  # =========================================================
  # POD DISRUPTION BUDGET
  # =========================================================
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # =========================================================
  # TOPOLOGY SPREAD
  # =========================================================
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: notification-service

  # =========================================================
  # MONITORING
  # =========================================================
  sentry:
    enabled: false
    dsn: ""
    environment: production
    tracesSampleRate: 0.1

  metrics:
    enabled: true
    port: http-metrics
    path: /metrics
    interval: 30s
    serviceMonitor:
      labels:
        release: monitoring

  extraVolumes: []
  extraVolumeMounts: []
