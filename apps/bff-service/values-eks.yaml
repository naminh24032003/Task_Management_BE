# =============================================================================
# BFF Service - EKS Environment Values
# =============================================================================
microservice:
  nameOverride: bff-service
  replicaCount: 2

  # =========================================================
  # CONTAINER IMAGE (ECR)
  # =========================================================
  image:
    repository: "${ECR_REGISTRY}/task-management/bff-service"
    tag: "${IMAGE_TAG}"
    pullPolicy: Always

  # =========================================================
  # ENVIRONMENT VARIABLES (ConfigMap)
  # =========================================================
  envVarsCM:
    NODE_ENV: production

    # Application
    APP_PORT: "4000"
    APP_METRICS_PORT: "9092"

    # Auth mode: standalone (BFF validates JWT directly; Kong marks /graphql as public so no header injection)
    AUTH_MODE: "standalone"

    # GraphQL - disabled in production
    GRAPHQL_PLAYGROUND: "false"
    GRAPHQL_INTROSPECTION: "false"
    GRAPHQL_DEBUG: "false"

    # gRPC Services
    GRPC_USER_SERVICE_URL: "user-service.dev.svc.cluster.local:50051"
    GRPC_TASK_SERVICE_URL: "task-service.dev.svc.cluster.local:50052"

    # Redis Cluster
    REDIS_HOST: "redis-cluster.redis.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_KEY_PREFIX: "bff-service:"

    # Rate Limiting (production - stricter)
    RATE_LIMIT_USER_LIMIT: "100"
    RATE_LIMIT_USER_WINDOW: "60"
    RATE_LIMIT_IP_LIMIT: "50"
    RATE_LIMIT_IP_WINDOW: "60"

    # CORS
    CORS_ORIGINS: "https://taskmanagement.dev"

    # OpenTelemetry
    OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.tracing.svc.cluster.local:4317"
    OTEL_SERVICE_NAME: "bff-service"

  # =========================================================
  # SENSITIVE ENVIRONMENT VARIABLES
  # Populated via --set in CI/CD pipeline
  # =========================================================
  envVarsSecret:
    JWT_SECRET: "PLACEHOLDER"
    REDIS_PASSWORD: "PLACEHOLDER"

  # =========================================================
  # CONTAINER PORTS
  # =========================================================
  containerPorts:
    http:
      port: 4000
    http-metrics:
      port: 9092

  # =========================================================
  # SERVICE CONFIGURATION
  # =========================================================
  service:
    type: ClusterIP
    ports:
      http:
        port: 4000
        targetPort: http
      http-metrics:
        port: 9092
        targetPort: http-metrics

  # =========================================================
  # RESOURCE REQUESTS & LIMITS
  # =========================================================
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # =========================================================
  # HEALTH PROBES (TCP check)
  # =========================================================
  livenessProbe:
    httpGet: null
    tcpSocket:
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet: null
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # =========================================================
  # AUTOSCALING
  # =========================================================
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  # =========================================================
  # POD DISRUPTION BUDGET
  # =========================================================
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # =========================================================
  # TOPOLOGY SPREAD
  # =========================================================
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: bff-service
  # =========================================================
  tolerations:
    - key: dedicated
      operator: Equal
      value: platform
      effect: NoSchedule

  # =========================================================
  # MONITORING
  # =========================================================
  metrics:
    enabled: true
    port: http-metrics
    path: /metrics
    interval: 30s
    serviceMonitor:
      labels:
        release: monitoring

# =========================================================
# SECRETS (managed by External Secrets Operator)
# =========================================================
secrets:
  jwtSecret: "PLACEHOLDER_OVERRIDE_VIA_EXTERNAL_SECRETS"
  redisPassword: "PLACEHOLDER_OVERRIDE_VIA_EXTERNAL_SECRETS"

# =========================================================
# INGRESS (BFF is behind Kong, own ingress disabled)
# =========================================================
bffIngress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: api.taskmanagement.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
