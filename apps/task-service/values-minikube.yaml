# =========================================================
# GLOBAL SETTINGS
# =========================================================
microservice:
  nameOverride: task-service
  replicaCount: 1

  # =========================================================
  # CONTAINER IMAGE SETTINGS
  # =========================================================
  image:
    repository: task-service
    tag: v2
    pullPolicy: IfNotPresent

  # =========================================================
  # ENVIRONMENT VARIABLES (ConfigMap)
  # =========================================================
  envVarsCM:
    GO_ENV: development

  # =========================================================
  # SENSITIVE ENVIRONMENT VARIABLES (Secrets)
  # =========================================================
  envVarsSecret: {}

  # =========================================================
  # CONTAINER PORTS
  # =========================================================
  containerPorts:
    grpc:
      port: 50052
    http-metrics:
      port: 9091

  # =========================================================
  # SERVICE CONFIGURATION
  # =========================================================
  service:
    type: ClusterIP
    ports:
      grpc:
        port: 50052
        targetPort: grpc
      http-metrics:
        port: 9091
        targetPort: http-metrics

  # =========================================================
  # RESOURCE REQUESTS & LIMITS
  # =========================================================
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # =========================================================
  # HEALTH PROBES
  # =========================================================
  livenessProbe: null
  readinessProbe: null

  # =========================================================
  # MONITORING & ERROR TRACKING
  # =========================================================
  sentry:
    enabled: false
    dsn: "https://your-dsn@sentry.io/project"
    environment: development
    tracesSampleRate: 1.0

  metrics:
    enabled: true
    port: http-metrics
    path: /metrics
    interval: 30s
    serviceMonitor:
      labels:
        release: monitoring

  extraVolumes: []
  extraVolumeMounts: []
