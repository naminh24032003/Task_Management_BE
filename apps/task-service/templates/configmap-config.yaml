apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.fullname" . }}-app-config
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
data:
  config-minikube.yaml: |
    server:
      http:
        addr: 0.0.0.0:9091
        timeout: 1s
      grpc:
        addr: 0.0.0.0:50052
        timeout: 1s

    data:
      database:
        driver: mongodb
        source: mongodb://root:MongoDB%40Root2024Secure%21@task-mongodb-mongodb-sharded.mongodb-task.svc.cluster.local:27017/task-service?authSource=admin
        name: task-service
        min_pool_size: 10
        max_pool_size: 100
        connect_timeout: 10
        server_selection_timeout: 30
        socket_timeout: 45
        read_preference: primaryPreferred
        read_concern: majority
        write_concern: majority

      redis:
        addr: redis-master.redis.svc.cluster.local:6379
        read_timeout: 0.2s
        write_timeout: 0.2s

    logging:
      level: debug
      format: json
      output: stdout

  config-eks.yaml: |
    server:
      http:
        addr: 0.0.0.0:9091
        timeout: 1s
      grpc:
        addr: 0.0.0.0:50052
        timeout: 1s

    data:
      database:
        driver: mongodb
        source: ${MONGODB_URI}
        name: ${MONGODB_DATABASE:-task-service}
        min_pool_size: 20
        max_pool_size: 200
        connect_timeout: 10
        server_selection_timeout: 30
        socket_timeout: 60
        read_preference: primaryPreferred
        read_concern: majority
        write_concern: majority

      redis:
        addr: ${REDIS_ADDR}
        read_timeout: 0.2s
        write_timeout: 0.2s

    logging:
      level: info
      format: json
      output: stdout
