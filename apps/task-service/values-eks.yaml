# =============================================================================
# Task Service - EKS Environment Values
# =============================================================================
microservice:
  nameOverride: task-service
  replicaCount: 2

  # =========================================================
  # CONTAINER IMAGE (ECR)
  # =========================================================
  image:
    repository: "${ECR_REGISTRY}/task-management/task-service"
    tag: "${IMAGE_TAG}"
    pullPolicy: Always

  # Override CMD to load EKS config
  args:
    - "-conf"
    - "./configs/config-eks.yaml"

  # =========================================================
  # ENVIRONMENT VARIABLES (ConfigMap)
  # =========================================================
  envVarsCM:
    GO_ENV: production
    # MongoDB
    MONGODB_DATABASE: "task-service"
    # Redis
    REDIS_HOST: "redis-cluster.redis.svc.cluster.local"
    REDIS_PORT: "6379"
    # OpenTelemetry
    OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector.tracing.svc.cluster.local:4317"
    OTEL_SERVICE_NAME: "task-service"
    # Kafka
    KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
    KAFKA_SASL_USERNAME: "kafka-user"
    KAFKA_SASL_ENABLED: "true"
    KAFKA_SASL_MECHANISM: "SCRAM-SHA-256"

  # =========================================================
  # SENSITIVE ENVIRONMENT VARIABLES (Secrets)
  # =========================================================
  envVarsSecret:
    MONGODB_URI: "PLACEHOLDER_OVERRIDE_VIA_EXTERNAL_SECRETS"
    REDIS_PASSWORD: "PLACEHOLDER_OVERRIDE_VIA_EXTERNAL_SECRETS"
    KAFKA_SASL_PASSWORD: "PLACEHOLDER_OVERRIDE_VIA_EXTERNAL_SECRETS"

  # =========================================================
  # CONTAINER PORTS
  # =========================================================
  containerPorts:
    grpc:
      port: 50052
    http-metrics:
      port: 9091

  # =========================================================
  # SERVICE CONFIGURATION
  # =========================================================
  service:
    type: ClusterIP
    ports:
      grpc:
        port: 50052
        targetPort: grpc
      http-metrics:
        port: 9091
        targetPort: http-metrics

  # =========================================================
  # RESOURCE REQUESTS & LIMITS
  # =========================================================
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # =========================================================
  # HEALTH PROBES (TCP check - task-service has no /health endpoint)
  # =========================================================
  livenessProbe:
    httpGet: null
    tcpSocket:
      port: grpc
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet: null
    tcpSocket:
      port: grpc
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # =========================================================
  # AUTOSCALING (HPA)
  # =========================================================
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  # =========================================================
  # POD DISRUPTION BUDGET
  # =========================================================
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # =========================================================
  # TOPOLOGY SPREAD
  # =========================================================
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: task-service

  # =========================================================
  # MONITORING
  # =========================================================
  sentry:
    enabled: false
    dsn: ""
    environment: production
    tracesSampleRate: 0.1

  metrics:
    enabled: true
    port: http-metrics
    path: /metrics
    interval: 30s
    serviceMonitor:
      labels:
        release: monitoring

  extraVolumes:
    - name: app-config
      configMap:
        name: task-service-app-config
  extraVolumeMounts:
    - name: app-config
      mountPath: /app/configs/config-eks.yaml
      subPath: config-eks.yaml
