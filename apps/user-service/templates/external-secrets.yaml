{{- if .Values.secrets }}
# ==========================================================
# User Service Secrets
# ==========================================================
# This file creates secrets for sensitive configuration data
# For production, consider using External Secrets Operator
# or Sealed Secrets for better secret management
# ==========================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.secrets.mongodbUri }}
  # MongoDB Connection URI - points to mongos router
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  # JWT Secret for token signing
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.redisPassword }}
  # Redis Password
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientId }}
  # Google OAuth2
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
