# =========================================================
# GLOBAL SETTINGS
# =========================================================
nameOverride: user-service
replicaCount: 1

# =========================================================
# CONTAINER IMAGE SETTINGS
# =========================================================
image:
  repository: user-service
  tag: latest
  pullPolicy: IfNotPresent

# =========================================================
# ENVIRONMENT VARIABLES (ConfigMap)
# =========================================================
envVarsCM:
  NODE_ENV: development

# =========================================================
# SENSITIVE ENVIRONMENT VARIABLES (Secrets)
# =========================================================
envVarsSecret: {}

# =========================================================
# CONTAINER PORTS
# =========================================================
containerPorts:
  grpc:
    port: 50051

# =========================================================
# SERVICE CONFIGURATION
# =========================================================
service:
  type: ClusterIP
  ports:
    grpc:
      port: 50051
      targetPort: grpc

# =========================================================
# RESOURCE REQUESTS & LIMITS
# =========================================================
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# =========================================================
# HEALTH PROBES
# =========================================================
livenessProbe: null
readinessProbe: null

# =========================================================
# VOLUMES
# =========================================================
extraVolumes: []
extraVolumeMounts: []
