# =========================================================
# GLOBAL SETTINGS
# =========================================================
microservice:
  nameOverride: user-service
  replicaCount: 1

  # =========================================================
  # CONTAINER IMAGE SETTINGS
  # =========================================================
  image:
    repository: user-service
    tag: v11
    pullPolicy: IfNotPresent

  # =========================================================
  # ENVIRONMENT VARIABLES (ConfigMap) - Non-sensitive only
  # =========================================================
  envVarsCM:
    NODE_ENV: development
    GRPC_URL: "0.0.0.0:50051"
    METRICS_PORT: "9090"
    # MongoDB Configuration - non-sensitive settings
    # Using 'userservice' (no dash) to avoid existing sharding rules
    MONGODB_DATABASE: "userservice"
    MONGODB_POOL_MIN: "5"
    MONGODB_POOL_MAX: "50"
    MONGODB_SOCKET_TIMEOUT: "45000"
    MONGODB_SERVER_SELECTION_TIMEOUT: "30000"
    # JWT Configuration - non-sensitive
    JWT_EXPIRES_IN: "3600"
    # Redis Configuration - non-sensitive settings
    REDIS_HOST: "redis-cluster-master.redis.svc.cluster.local"
    REDIS_PORT: "6379"
    REDIS_DB: "0"
    REDIS_KEY_PREFIX: "user-service:"
    REDIS_CONNECT_TIMEOUT: "10000"
    REDIS_COMMAND_TIMEOUT: "5000"
    REDIS_MAX_RETRIES: "3"
    # Kafka Configuration
    KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
    KAFKA_USERNAME: "kafka-user"
    KAFKA_CLIENT_ID: "user-service"
    KAFKA_GROUP_ID: "user-service-group"
    KAFKA_SASL_MECHANISM: "scram-sha-256"

  # =========================================================
  # SENSITIVE ENVIRONMENT VARIABLES (Secrets)
  # =========================================================
  # This section is kept empty - secrets are managed via
  # external-secrets.yaml template and referenced below
  envVarsSecret: {}

  # =========================================================
  # REFERENCE TO EXTERNAL SECRETS
  # =========================================================
  # Reference the user-service-secrets created by templates/external-secrets.yaml
  envFromSecretRefs:
    - user-service-secrets

  # =========================================================
  # CONTAINER PORTS
  # =========================================================
  containerPorts:
    grpc:
      port: 50051
    http-metrics:
      port: 9090

  # =========================================================
  # SERVICE CONFIGURATION
  # =========================================================
  service:
    type: ClusterIP
    ports:
      grpc:
        port: 50051
        targetPort: grpc
      http-metrics:
        port: 9090
        targetPort: http-metrics

  # =========================================================
  # RESOURCE REQUESTS & LIMITS
  # =========================================================
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # =========================================================
  # HEALTH PROBES
  # =========================================================
  livenessProbe: null
  readinessProbe: null

  # =========================================================
  # MONITORING & ERROR TRACKING
  # =========================================================
  sentry:
    enabled: false
    dsn: "https://your-dsn@sentry.io/project"
    environment: development
    tracesSampleRate: 1.0

  metrics:
    enabled: true
    port: http-metrics
    path: /metrics
    interval: 30s
    serviceMonitor:
      labels:
        release: monitoring

  extraVolumes: []
  extraVolumeMounts: []

# =========================================================
# SECRETS CONFIGURATION
# =========================================================
# These values will be stored in Kubernetes Secrets
# In production, use sealed-secrets or external-secrets-operator
# and store actual values in a secure location (Vault, AWS SM, etc.)
#
# For local development, you can override these in a local
# values-minikube-secrets.yaml file (gitignored)
# =========================================================
secrets:
  # MongoDB URI - points to mongos router
  # Format: mongodb://user:password@host:port/database?authSource=admin
  # Using 'userservice' (no dash) to avoid existing sharding rules
  mongodbUri: "mongodb://root:MongoDB%40Root2024Secure%21@user-mongodb-mongodb-sharded.mongodb-user.svc.cluster.local:27017/userservice?authSource=admin"

  # JWT Secret for token signing
  jwtSecret: "your-super-secret-jwt-key-change-in-production"

  # Redis Password
  redisPassword: "Redis@Cluster2024Secure!"

  # Google OAuth2 - Get from Google Cloud Console
  googleClientId: "your-google-client-id.apps.googleusercontent.com"
  googleClientSecret: "your-google-client-secret"

  # Additional secrets can be added here
  extra:
    KAFKA_PASSWORD: "Kafka@SASL2024Secure!"
