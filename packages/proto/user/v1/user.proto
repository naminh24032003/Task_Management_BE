syntax = "proto3";

package user;

option go_package = "user/v1;userv1";

import "google/api/annotations.proto";

service UserService {
  rpc HelloWorld (HelloRequest) returns (HelloResponse) {
    option (google.api.http) = {
      post: "/v1/users/hello"
      body: "*"
    };
  }
}

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}
