syntax = "proto3";

package task.v1;

option go_package = "task-service/api/task/v1;taskv1";

import "google/api/annotations.proto";

service TaskService {
  rpc Hello(HelloRequest) returns (HelloResponse) {
    option (google.api.http) = {
      get: "/v1/tasks/hello"
    };
  }
}

