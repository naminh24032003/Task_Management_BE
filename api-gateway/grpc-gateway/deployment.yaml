apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-gateway
  namespace: kong
  labels:
    app: grpc-gateway
    component: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grpc-gateway
  template:
    metadata:
      labels:
        app: grpc-gateway
        component: api-gateway
      annotations:
        # Enable Istio sidecar injection for mTLS
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: grpc-gateway
        image: grpc-gateway:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        # User Service
        - name: USER_SERVICE_ENDPOINT
          value: "user-service.dev.svc.cluster.local:50051"
        - name: TASK_SERVICE_ENDPOINT
          value: "task-service.dev.svc.cluster.local:50052"
        - name: HTTP_PORT
          value: ":8080"
        # Enable mTLS - Istio sidecar handles encryption
        - name: USE_MTLS
          value: "true"
        # Không dùng health check vì gRPC backend cần connection
        # Gateway sẽ tự restart nếu có lỗi
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-gateway
  namespace: kong
  labels:
    app: grpc-gateway
    component: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: grpc-gateway
