server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:50051  # Changed to standard gRPC port
    timeout: 1s

data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/test?parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

# gRPC Client configurations for other microservices
grpc_clients:
  task_service:
    address: "task-service-microservice:50051"
    timeout: 10s
    max_retries: 3
    enable_load_balancing: true
    
  auth_service:
    address: "auth-service-microservice:50051"
    timeout: 5s
    max_retries: 3
    enable_load_balancing: true
    
  project_service:
    address: "project-service-microservice:50051"
    timeout: 10s
    max_retries: 3
    enable_load_balancing: true
    
  notification_service:
    address: "notification-service-microservice:50051"
    timeout: 15s  # Longer timeout for notification operations
    max_retries: 2
    enable_load_balancing: true

# Kubernetes service discovery
service_discovery:
  namespace: "default"  # Override via K8S_NAMESPACE env var
  dns_suffix: "svc.cluster.local"
