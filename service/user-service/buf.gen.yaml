version: v1

managed:
  enabled: true
  go_package_prefix:
    default: github.com/naminh24032003/task_management_be/service/user-service/api

plugins:
  - plugin: buf.build/protocolbuffers/go
    out: api
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: api
    opt:
      - paths=source_relative
