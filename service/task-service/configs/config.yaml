server:
  http:
    addr: 0.0.0.0:9091
    timeout: 1s
  grpc:
    addr: 0.0.0.0:50052
    timeout: 1s

data:
  database:
    driver: mongodb
    # MongoDB Connection String for Local Development
    # Port-forward: kubectl port-forward -n mongodb-task svc/task-mongodb-mongodb-sharded 27018:27017
    source: mongodb://root:MongoDB%40Root2024Secure%21@localhost:27018/task-service?authSource=admin
    name: task-service
    # Connection Pool
    min_pool_size: 5
    max_pool_size: 50
    # Timeouts (in seconds)
    connect_timeout: 10
    server_selection_timeout: 30
    socket_timeout: 45
    # Read/Write Concerns
    read_preference: primaryPreferred
    read_concern: majority
    write_concern: majority

  redis:
    addr: ${REDIS_HOST}:${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    db: 0
    key_prefix: "task-service:"
    read_timeout: 0.2s
    write_timeout: 0.2s
    connect_timeout: 10s
    max_retries: 3

logging:
  level: debug
  format: console
  output: stdout
