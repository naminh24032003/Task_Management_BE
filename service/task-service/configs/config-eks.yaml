server:
  http:
    addr: 0.0.0.0:9091
    timeout: 1s
  grpc:
    addr: 0.0.0.0:50052
    timeout: 1s

data:
  database:
    driver: mongodb
    # MongoDB Connection String for Task MongoDB Cluster in EKS
    # This will be overridden by environment variables in production
    # Format: mongodb://username:password@host:port/database?authSource=admin
    source: ${MONGODB_URI}
    name: ${MONGODB_DATABASE:-task-service}
    # Connection Pool
    min_pool_size: 20
    max_pool_size: 200
    # Timeouts (in seconds)
    connect_timeout: 10
    server_selection_timeout: 30
    socket_timeout: 60
    # Read/Write Concerns
    read_preference: primaryPreferred
    read_concern: majority
    write_concern: majority

  redis:
    addr: ${REDIS_ADDR}
    read_timeout: 0.2s
    write_timeout: 0.2s

logging:
  level: info
  format: json
  output: stdout
