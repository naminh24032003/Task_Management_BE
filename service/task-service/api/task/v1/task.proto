syntax = "proto3";

package task.v1;

option go_package = "task-service/api/task/v1;taskv1";

service TaskService {
  rpc Hello(HelloRequest) returns (HelloResponse);
}

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}
